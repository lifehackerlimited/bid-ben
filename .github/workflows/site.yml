# Keeps bidben.betttech.co.uk up to date, so nobody has to.
# Every morning it:
#   1. fetches the last few days of notices from Contracts Finder and Find a Tender (both free, no password)
#   2. on Mondays, builds the week's issue (issues/<date>/)
#   3. rebuilds every page, and saves the changes back here, which publishes them
# The outreach autopilot (a separate, private repository) emails the Monday issue to subscribers at 09:00.
# To run it by hand: Actions tab > Site > Run workflow. To pause it: Actions tab > Site > "..." > Disable workflow.
name: Site

on:
  schedule:
    - cron: "40 4 * * *"    # 04:40 UTC every day (GitHub often starts up to 40 minutes late)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (it always catches up from the last run anyway)"
        default: "4"

permissions:
  contents: write
  pages: write

concurrency:
  group: site   # never two runs at once

env:
  TZ: Europe/London

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the builder still works
        run: python -m unittest discover -s tests
      - name: Fetch new notices and rebuild the site
        run: python -m builder all --days "${{ inputs.days || '4' }}"
      - name: Save the changes
        id: save
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed today."; exit 0; fi
          git config user.name "Bid Ben builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Site update: $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && echo "pushed=yes" >> "$GITHUB_OUTPUT" && exit 0; sleep 10; done
          echo "::error::Couldn't save the updated pages. The site will show yesterday's tenders until the next run."
          exit 1
      - name: Ask GitHub Pages to publish
        if: steps.save.outputs.pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::notice::Pages will publish by itself."
